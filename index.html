<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NavHub Pro - Customizable Navigation</title>
    <meta name="description" content="A premium, customizable navigation dashboard inspired by gongke.net. Features category management, link organization, and Notion integration capabilities." />
    <meta property="og:title" content="NavHub Pro - Customizable Navigation" />
    <meta property="og:description" content="A premium, customizable navigation dashboard inspired by gongke.net. Features category management, link organization, and Notion integration capabilities." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: 'var(--brand-50)',
                100: 'var(--brand-100)',
                200: 'var(--brand-200)',
                300: 'var(--brand-300)',
                400: 'var(--brand-400)',
                500: 'var(--brand-500)',
                600: 'var(--brand-600)',
                700: 'var(--brand-700)',
                800: 'var(--brand-800)',
                900: 'var(--brand-900)',
                950: 'var(--brand-950)',
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 2s infinite linear',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'tactile-ripple': 'tactileRipple 0.45s cubic-bezier(0.1, 0.8, 0.3, 1) forwards',
            },
            keyframes: {
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              tactileRipple: {
                '0%': { transform: 'scale(0)', opacity: '0.45' },
                '100%': { transform: 'scale(1)', opacity: '0' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --brand-50: #eef2ff; --brand-100: #e0e7ff; --brand-200: #c7d2fe;
        --brand-300: #a5b4fc; --brand-400: #818cf8; --brand-500: #6366f1;
        --brand-600: #4f46e5; --brand-700: #4338ca; --brand-800: #3730a3;
        --brand-900: #1e1b4b; --brand-950: #171717;
      }

      body {
        font-family: "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #f8fafc;
        margin: 0;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: 0.01em;
        -webkit-tap-highlight-color: transparent;
      }
      
      @keyframes tactileRipple {
        0% { transform: scale(0); opacity: 0.45; }
        100% { transform: scale(1); opacity: 0; }
      }
      .animate-tactile-ripple {
        animation: tactileRipple 0.45s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
      }
      
      .font-black {
        font-weight: 600 !important;
        font-family: "Inter", sans-serif !important;
        letter-spacing: 0.02em !important;
      }
      
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

      /* ==================== FUTURISTIC CYBER OPENING SCREEN ==================== */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #080b14;
        color: #ffffff;
        z-index: 99999;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), 
                    transform 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                    filter 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                    visibility 0.65s;
        will-change: opacity, transform, filter;
      }

      #initial-loader.intro-exit {
        opacity: 0;
        transform: scale(1.05);
        filter: blur(14px);
        pointer-events: none;
        visibility: hidden;
      }

      /* Cybernetic Perspective Grid & Vignette */
      .intro-grid-backdrop {
        position: absolute;
        inset: 0;
        background-image: 
          radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.16) 0%, transparent 68%),
          linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 100% 100%, 36px 36px, 36px 36px;
        background-position: center center;
        pointer-events: none;
      }

      /* Breathing Ambient Aurora Orbs */
      .intro-aurora {
        position: absolute;
        border-radius: 9999px;
        filter: blur(85px);
        pointer-events: none;
        opacity: 0.55;
        will-change: transform;
      }
      .aurora-1 {
        width: 440px;
        height: 440px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, rgba(139, 92, 246, 0.25) 50%, transparent 70%);
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        animation: aurora-float-1 9s ease-in-out infinite alternate;
      }
      .aurora-2 {
        width: 340px;
        height: 340px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.35) 0%, rgba(59, 130, 246, 0.18) 60%, transparent 75%);
        bottom: 18%;
        left: 32%;
        animation: aurora-float-2 11s ease-in-out infinite alternate-reverse;
      }
      .aurora-3 {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, rgba(168, 85, 247, 0.15) 60%, transparent 70%);
        top: 25%;
        right: 25%;
        animation: aurora-float-1 13s ease-in-out infinite alternate;
      }

      @keyframes aurora-float-1 {
        0% { transform: translate(-50%, 0) scale(0.94); }
        50% { transform: translate(-46%, -18px) scale(1.06); }
        100% { transform: translate(-54%, 18px) scale(0.98); }
      }
      @keyframes aurora-float-2 {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(25px, -20px) scale(1.08); }
        100% { transform: translate(-20px, 15px) scale(0.92); }
      }

      /* Stage & Concentric HUD Rings */
      .intro-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .emblem-wrapper {
        position: relative;
        width: 144px;
        height: 144px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hud-ring-outer {
        position: absolute;
        width: 136px;
        height: 136px;
        border-radius: 50%;
        border: 1px dashed rgba(129, 140, 248, 0.45);
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.18);
        animation: hud-spin 22s linear infinite;
      }

      .hud-ring-middle {
        position: absolute;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        border-top-color: rgba(56, 189, 248, 0.75);
        border-bottom-color: rgba(192, 132, 252, 0.75);
        animation: hud-spin-rev 14s linear infinite;
      }

      .hud-ring-glow {
        position: absolute;
        width: 84px;
        height: 84px;
        border-radius: 28px;
        background: rgba(99, 102, 241, 0.28);
        filter: blur(14px);
        animation: core-pulse 2.6s ease-in-out infinite alternate;
      }

      @keyframes hud-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes hud-spin-rev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes core-pulse {
        0% { transform: scale(0.9); opacity: 0.45; }
        100% { transform: scale(1.3); opacity: 0.9; filter: blur(18px); }
      }

      /* Central Squircle Nexus Core */
      .intro-core {
        position: relative;
        width: 78px;
        height: 78px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.96) 100%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow: 
          0 14px 34px -4px rgba(0, 0, 0, 0.75),
          0 0 28px rgba(99, 102, 241, 0.55),
          inset 0 1px 1px rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(16px);
        transform: translateZ(0);
        animation: core-intro 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes core-intro {
        0% { transform: scale(0.6) rotate(-15deg); opacity: 0; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }

      .core-symbol {
        width: 44px;
        height: 44px;
        filter: drop-shadow(0 0 9px rgba(129, 140, 248, 0.75));
        animation: symbol-float 3s ease-in-out infinite alternate;
      }

      @keyframes symbol-float {
        0% { transform: scale(0.96); }
        100% { transform: scale(1.04); }
      }

      /* Brand Typography */
      .intro-brand-box {
        margin-top: 24px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .intro-title {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 9px;
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 800;
        font-size: 26px;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 45%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 32px rgba(129, 140, 248, 0.35);
        animation: fadeIn 0.8s ease-out 0.2s forwards;
        opacity: 0;
      }

      .intro-title-badge {
        font-size: 11px;
        letter-spacing: 0.08em;
        font-weight: 800;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.35);
        padding: 2px 7px;
        border-radius: 6px;
        -webkit-text-fill-color: #38bdf8;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        text-indent: 0;
      }

      .intro-subtitle {
        margin: 8px 0 0 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: #94a3b8;
        opacity: 0;
        animation: fadeIn 0.8s ease-out 0.35s forwards;
      }

      .status-beacon {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
        animation: beacon-pulse 1.8s ease-in-out infinite;
      }

      @keyframes beacon-pulse {
        0%, 100% { opacity: 0.45; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.25); }
      }

      /* Cyber Telemetry & Glowing Progress */
      .intro-progress-box {
        margin-top: 30px;
        width: 250px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        opacity: 0;
        animation: fadeIn 0.8s ease-out 0.45s forwards;
      }

      .progress-track {
        position: relative;
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .progress-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 0%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
        box-shadow: 0 0 14px rgba(129, 140, 248, 0.9);
        transition: width 0.15s ease-out;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #64748b;
      }

      .status-msg {
        color: #94a3b8;
        font-weight: 500;
        transition: opacity 0.2s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 195px;
      }

      .status-pct {
        color: #818cf8;
        font-weight: 700;
      }

      .intro-quick-skip {
        position: absolute;
        bottom: 28px;
        font-size: 11px;
        color: #475569;
        letter-spacing: 0.12em;
        transition: all 0.3s;
        cursor: pointer;
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid transparent;
      }
      .intro-quick-skip:hover {
        color: #94a3b8;
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@hello-pangea/dnd": "https://aistudiocdn.com/@hello-pangea/dnd@^18.0.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.6",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0"
  }
}
</script>
</head>
  <body>
    <!-- ==================== FUTURISTIC OPENING SCREEN ==================== -->
    <div id="initial-loader">
      <!-- Ambient Grid & Cosmic Auroras -->
      <div class="intro-grid-backdrop"></div>
      <div class="intro-aurora aurora-1"></div>
      <div class="intro-aurora aurora-2"></div>
      <div class="intro-aurora aurora-3"></div>

      <!-- Sci-Fi HUD Stage -->
      <div class="intro-stage">
        <!-- Rotating HUD Rings -->
        <div class="emblem-wrapper">
          <div class="hud-ring-outer"></div>
          <div class="hud-ring-middle"></div>
          <div class="hud-ring-glow"></div>

          <!-- Central Glowing Squircle Nexus Hub -->
          <div class="intro-core">
            <svg class="core-symbol" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8" />
                  <stop offset="50%" stop-color="#818cf8" />
                  <stop offset="100%" stop-color="#c084fc" />
                </linearGradient>
                <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
                  <feGaussianBlur stdDeviation="2.5" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
              </defs>
              <circle cx="24" cy="24" r="19" stroke="url(#coreGrad)" stroke-width="1.8" stroke-dasharray="7 5" opacity="0.6" />
              <!-- Cyber Compass Star -->
              <path d="M24 7L28.2 19.8L41 24L28.2 28.2L24 41L19.8 28.2L7 24L19.8 19.8L24 7Z" fill="url(#coreGrad)" filter="url(#coreGlow)" />
              <circle cx="24" cy="24" r="3.2" fill="#ffffff" />
              <circle cx="24" cy="7" r="1.5" fill="#38bdf8" />
              <circle cx="41" cy="24" r="1.5" fill="#818cf8" />
              <circle cx="24" cy="41" r="1.5" fill="#c084fc" />
              <circle cx="7" cy="24" r="1.5" fill="#38bdf8" />
            </svg>
          </div>
        </div>

        <!-- Brand Typography -->
        <div class="intro-brand-box">
          <h1 class="intro-title">
            <span>NAVHUB</span>
            <span class="intro-title-badge">PRO</span>
          </h1>
          <p class="intro-subtitle">
            <span class="status-beacon"></span>
            <span>NEXT-GEN WORKSPACE HUB · 智能工作台枢纽</span>
          </p>
        </div>

        <!-- Telemetry Progress Bar -->
        <div class="intro-progress-box">
          <div class="progress-track">
            <div class="progress-bar-fill" id="intro-progress-bar"></div>
          </div>
          <div class="progress-meta">
            <span class="status-msg" id="intro-status-msg">INITIALIZING SYSTEM...</span>
            <span class="status-pct" id="intro-pct">0%</span>
          </div>
        </div>
      </div>

      <!-- Quick Skip Hint -->
      <div class="intro-quick-skip" id="intro-skip-btn">PRESS ANYWHERE TO ENTER · 点击快速进入</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      (function() {
        const loader = document.getElementById('initial-loader');
        if (!loader) return;

        const bar = document.getElementById('intro-progress-bar');
        const pct = document.getElementById('intro-pct');
        const msg = document.getElementById('intro-status-msg');

        const steps = [
          { at: 18, text: "INITIALIZING MATRIX · 系统初始化..." },
          { at: 42, text: "SYNCING WORKSPACE · 同步工作区拓扑..." },
          { at: 72, text: "SECURING HUBS · 验证网络协议..." },
          { at: 90, text: "FINALIZING · 即将就绪..." }
        ];

        let progress = 0;
        let isFinished = false;
        let stepIdx = 0;

        const updateUI = (val) => {
          progress = Math.min(100, Math.round(val));
          if (bar) bar.style.width = progress + '%';
          if (pct) pct.textContent = progress + '%';
          if (msg && steps[stepIdx] && progress >= steps[stepIdx].at) {
            msg.textContent = steps[stepIdx].text;
            stepIdx++;
          }
        };

        // Smooth progressive ticker
        const timer = setInterval(() => {
          if (isFinished) return;
          if (progress < 88) {
            const increment = Math.max(1, (88 - progress) * 0.16 + Math.random() * 2.5);
            updateUI(progress + increment);
          }
        }, 50);

        const dismissLoader = () => {
          if (isFinished) return;
          isFinished = true;
          clearInterval(timer);
          updateUI(100);
          if (msg) msg.textContent = "READY · 即刻进入";

          setTimeout(() => {
            loader.classList.add('intro-exit');
            setTimeout(() => {
              if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 700);
          }, 280);
        };

        // Complete when navhub-ready or load event triggers
        window.addEventListener('navhub-ready', dismissLoader, { once: true });
        window.addEventListener('load', () => {
          setTimeout(dismissLoader, 300);
        }, { once: true });

        // Safe auto-dismiss timeout (maximum 2.2s so user never waits)
        setTimeout(dismissLoader, 2200);

        // Click / touch to fast-track enter
        loader.addEventListener('click', dismissLoader);
      })();
    </script>
  </body>
